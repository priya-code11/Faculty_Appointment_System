{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block auth_content %}

<div class="auth-page">
    <div class="auth-card" style="max-width: 650px;">
        <div class="text-center mb-4">
            <div class="auth-logo mb-3">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3>
                Create Account
            </h3>
            <p class="text-muted">
                Register for the Faculty Appointment System
            </p>
        </div>
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Full Name
                    </label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Email
                    </label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="mb-4">
                <label class="form-label">
                    Register As
                </label>
                <select name="role" id="role" class="form-select" onchange="showRoleFields()" required>
                    <option value="">Select Role</option>
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            </div>


            <!-- STUDENT -->

            <div id="studentFields" style="display:none;">

                <h6 class="mb-3">
                    Student Information
                </h6>

                <div class="mb-3">

                    <label class="form-label">
                        Enrollment Number
                    </label>

                    <input
                        type="text"
                        name="enrollment_no"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        name="student_department"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Semester
                    </label>

                    <input
                        type="number"
                        name="semester"
                        class="form-control"
                        min="1"
                        max="8"
                    >

                </div>

            </div>


            <!-- FACULTY -->

            <div id="facultyFields" style="display:none;">

                <h6 class="mb-3">
                    Faculty Information
                </h6>

                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        name="faculty_department"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Designation
                    </label>

                    <input
                        type="text"
                        name="designation"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Specialization
                    </label>

                    <input
                        type="text"
                        name="specialization"
                        class="form-control"
                    >

                </div>

            </div>


            <button class="btn btn-black w-100 mt-3">

                Create Account

                <i class="bi bi-arrow-right ms-2"></i>

            </button>

        </form>


        <div class="text-center mt-4">

            <small class="text-muted">
                Already have an account?
            </small>

            <a
                href="{{ url_for('auth.login') }}"
                class="fw-semibold"
            >
                Login
            </a>

        </div>
    </div>

</div>

{% endblock %}
