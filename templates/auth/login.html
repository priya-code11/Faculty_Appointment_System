{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block auth_content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="auth-logo mb-3">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <h3>
                Welcome Back
            </h3>

            <p class="text-muted">
                Faculty Appointment System
            </p>

        </div>


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button class="btn btn-black w-100">

                Login

                <i class="bi bi-arrow-right ms-2"></i>

            </button>

        </form>


        <div class="text-center mt-4">

            <small class="text-muted">
                Don't have an account?
            </small>

            <a
                href="{{ url_for('auth.register') }}"
                class="fw-semibold"
            >
                Register
            </a>

        </div>

    </div>

</div>

{% endblock %}
